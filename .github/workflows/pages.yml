name: Publish course site

# Renders week decks and publishes them to GitHub Pages.
#
# A PUSH renders only the weeks whose folder the push changed; every other deck
# is copied from the live site. A full render of all weeks takes hours (weeks
# 8-10 train), so it is never triggered by a push: run the workflow by hand
# with "weeks" empty for that, or with the weeks named, after a change to
# src/, uv.lock or assets/ that should reach decks whose slides.qmd did not change.
# HTML decks (deck.json, week 16 on) are assembled by build_site.py every run.
#
# slides.html is a gitignored build artifact (3-5 MB each, resources inlined),
# so Pages is where the decks actually become shareable. The artifact deploy
# below puts nothing into git -- no gh-pages branch, no history growth.

on:
  push:
    branches: [main]
    paths:
      - "weeks/**"
      - "src/**"
      - "scripts/build_site.py"
      - "_quarto.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      weeks:
        description: "Only render these week folders (space-separated, e.g. 05-actuation); the other decks are copied from the live site. Empty = every week (hours)."
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 120 was too short once there were 28 weeks: every run from 2026-11-02 on was
    # cancelled at 2 h, and since _freeze is cached only by a run that FINISHES,
    # each run re-executed every week and timed out again. A full re-execution
    # needs the room once; after it, unchanged weeks come from the cache.
    # (GitHub-hosted runners stop any job at 360 minutes.)
    timeout-minutes: 350
    outputs:
      failed: ${{ steps.render.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0               # the push's own commits, to see which weeks changed

      - name: Choose the weeks to render
        id: pick
        # mode=all: every week; mode=some: only "list"; nothing else re-renders.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list="${{ inputs.weeks }}"
            if [ -z "$list" ]; then mode=all; else mode=some; fi
          else
            before="${{ github.event.before }}"
            if git cat-file -e "$before^{commit}" 2>/dev/null; then
              range="$before ${{ github.sha }}"
            else
              range="${{ github.sha }}~1 ${{ github.sha }}"   # first push of a branch, or a force push
            fi
            # A deck reads only its slides.qmd (plus the package and assets/), so a
            # change to a lab script, README or instructor/ file does not re-render it.
            list=$(git diff --name-only --diff-filter=d $range -- 'weeks/*/slides.qmd' \
                   | cut -d/ -f2 | sort -u | tr '\n' ' ')
            mode=some
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "render: $mode ${list:-(no Quarto week changed: every deck comes from the live site)}"

      - name: Install a software renderer
        # The runner has no GPU, so soc4180._gl selects osmesa -- but only if
        # libOSMesa is actually findable. Without it _gl deliberately sets no
        # backend at all, and rendering raises with instructions instead.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libosmesa6 libosmesa6-dev libgl1 libglfw3 ffmpeg

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Restore executed cells
        # `freeze: auto` means an unchanged week is not re-executed. Keeping
        # _freeze in the Actions cache rather than in git gives the speed
        # without the repository bloat.
        #
        # The key is in two parts, and the split matters. Quarto's freeze keys
        # on the .qmd alone -- it does not know that soc4180 changed underneath
        # it -- so a cache restored across a package change would serve stale
        # results from a stale render. The environment hash is therefore the
        # *prefix*: change the package or the lockfile and nothing is restored,
        # forcing every week to re-execute. Adding or editing a week keeps that
        # prefix, so the restore-key hits, unchanged weeks are reused, and the
        # new key saves the new week's output for next time.
        uses: actions/cache@v4
        with:
          path: _freeze
          key: freeze-${{ hashFiles('src/soc4180/**/*.py', 'uv.lock') }}-${{ hashFiles('weeks/**/slides.qmd') }}
          restore-keys: |
            freeze-${{ hashFiles('src/soc4180/**/*.py', 'uv.lock') }}-

      - name: Install the course environment
        run: uv sync --extra rl --extra env --extra gpu

      - name: Report the render backend
        # CLAUDE.md rule: report which branch the GL selection took, so a
        # rendering failure is visible here rather than mysterious later.
        run: uv run python -c "import soc4180; print(soc4180.gl_report())"

      - name: Render every week
        id: render
        # One `quarto render` per week, so a single broken week costs one deck
        # instead of the whole site. `execute.error: false` still aborts that
        # week's render on a bad cell -- the protection is unchanged. Failures
        # are reported by a later job, so the decks that did render still ship.
        run: |
          failed=""
          mode="${{ steps.pick.outputs.mode }}"
          only="${{ steps.pick.outputs.list }}"
          for qmd in weeks/*/slides.qmd; do
            slug=$(basename "$(dirname "$qmd")")
            if [ "$mode" != all ] && ! echo " $only " | grep -q " $slug "; then
              # Not selected: keep the deck that is already published, so the
              # artifact deploy does not drop it from the site.
              curl -fsSL -o "weeks/$slug/slides.html"                 "https://gnoejh.github.io/soc4180/$slug/slides.html"                 && echo "kept live deck: $slug" || echo "no live deck for $slug"
              continue
            fi
            echo "::group::render $qmd"
            if uv run quarto render "$qmd"; then
              echo "ok: $qmd"
            else
              echo "::error file=$qmd::render failed"
              failed="${failed} ${qmd}"
            fi
            echo "::endgroup::"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"

      - name: Assemble the site
        run: uv run python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report:
    # Deliberately after deploy: a week that fails to render must not stop the
    # other ten from reaching the site, but it must still turn the run red.
    needs: [build, deploy]
    if: always() && needs.build.outputs.failed != ''
    runs-on: ubuntu-latest
    steps:
      - name: Name the weeks that did not render
        run: |
          echo "these weeks failed to render: ${{ needs.build.outputs.failed }}"
          exit 1
