[project]
name = "soc4180"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium[mujoco]>=1.3.0",
    "imageio-ffmpeg>=0.6.0",
    "mediapy>=1.2.7",
    "mujoco-menagerie>=2026.9.0",
    "numpy>=2.5.2",
    "torch>=2.14.0",
]

[project.optional-dependencies]
gpu = [
    "playground>=0.2.0",
]

[tool.uv.sources]
# PyPI ships CPU-only torch wheels for Windows, so Windows pulls the CUDA 13.0
# build from PyTorch's own index. On Linux (Colab) the PyPI wheel is already
# CUDA-enabled (it depends on nvidia-cudnn-cu13 / nccl), so we use PyPI there.
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/soc4180"]
